name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npm test
      - name: Gate — package.json version must match the tag
        run: |
          V="$(node -p "require('./package.json').version")"
          T="${GITHUB_REF_NAME#v}"
          test "$V" = "$T" || { echo "package.json version $V != tag $T"; exit 1; }
      # The outcome travels in a step output, not in a marker file: `hashFiles()`
      # only sees the workspace, so a /tmp marker is invisible to a later step's
      # `if:` — publish would be skipped silently. (Measured on a runner:
      # hashFiles('/tmp/x') is empty, workspace paths hash normally.)
      - name: Gate — already-published versions are skipped (backfilled tags stay safe)
        id: published
        run: |
          V="$(node -p "require('./package.json').version")"
          if npm view "dsh-draft@${V}" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "dsh-draft@${V} is already published — skipping publish"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.published.outputs.skip != 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Only assert `latest` when this run did the publishing: a backfilled tag
      # for an older version legitimately leaves `latest` where it is.
      #
      # The registry's read path can lag a few seconds behind a fresh publish
      # (v0.2.0's verify ran 0.5s after the upload and still saw the old tag), so
      # poll instead of failing a successful release on a stale read.
      - name: Verify dist-tag
        if: steps.published.outputs.skip != 'true'
        run: |
          V="$(node -p "require('./package.json').version")"
          for attempt in 1 2 3 4 5 6; do
            TAGS="$(npm view dsh-draft dist-tags --json || true)"
            if echo "$TAGS" | grep -q "\"latest\": *\"${V}\""; then
              echo "latest -> ${V} OK (attempt ${attempt})"
              echo "$TAGS"
              exit 0
            fi
            echo "attempt ${attempt}: latest is not ${V} yet — retrying in 10s"
            sleep 10
          done
          echo "::error::dist-tags still do not name ${V} as latest after ~60s"
          exit 1
